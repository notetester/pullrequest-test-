name: Temporary Nuwon DWG diagnostic

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install parser
        working-directory: dwg-work
        run: npm install --no-audit --no-fund
      - name: Download public Nuwon drawing
        run: curl --fail --location --retry 3 --output dwg-work/nuwon.dwg https://edu-design.sen.go.kr/rest/file/35882
      - name: Diagnose drawing
        working-directory: dwg-work
        run: node diagnose.mjs nuwon.dwg ../result
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: nuwon-dwg-diagnostic
          path: result
          if-no-files-found: error
          retention-days: 1
